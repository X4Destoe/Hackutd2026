[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operation-storm"
version = "0.1.0"
description = "Operation Storm backend: disaster impact, Fix-First actions, Photon messaging, help-site routing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ai = ["anthropic", "openai", "google-genai"]

[tool.setuptools.packages.find]
include = ["app*", "data*"]

[tool.setuptools.package-data]
data = ["*.json", "scenarios/*.json", "anchors/*.json"]

[tool.pytest.ini_options]
testpaths = ["app", "tests_e2e"]
addopts = "-q"
