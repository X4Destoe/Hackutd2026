</div></div><div class="action-row"><div><b>3 · Recompute</b><p>Proposed assignment refreshes for human approval.</p></div></div></div></div>`}
function statefarm(){const unack=state.aid.filter(a=>a.status==='Unacknowledged').length,urgent=state.aid.filter(a=>['high','critical'].includes(a.priority)).length;return `<div class="stats">${metric('Assistance requests',state.aid.length,'Fictional household reports','shield')}${metric('High-priority needs',urgent,'Escalation recommended','alert','text-amber')}${metric('Unacknowledged',unack,'Follow-up still required','clock',unack?'text-red':'')}${metric('Acknowledged',state.aid.filter(a=>a.status==='Acknowledged').length,'Confirmed in this simulation','check','text-teal')}</div><div class="grid-two"><div class="card card-pad"><div class="row-between"><div><h2 class="card-title">Catastrophe assistance queue</h2><p class="card-sub">Urgency and aging oversight, not claims adjudication</p></div>${tag('Simulation','warn')}</div><div class="mt12" style="overflow-x:auto"><table class="mini-table"><thead><tr><th>Case</th><th>Need</th><th>Priority</th><th>Status</th><th>Action</th></tr></thead><tbody>${[...state.aid].sort((a,b)=>({critical:0,high:1,medium:2,low:3}[a.priority]-{critical:0,high:1,medium:2,low:3}[b.priority])).map(a=>`<tr><td><strong>${esc(a.id)}</strong><div class="td-muted f-slim">${esc(a.name)}</div></td><td><span>${esc(a.need)}</span><div class="td-muted f-slim">${esc(a.zone)} · ${a.age} min old</div></td><td>${tag(a.priority,a.priority==='critical'?'danger':a.priority==='high'?'warn':'neutral')}</td><td class="td-muted">${esc(a.status)}</td><td>${a.status==='Acknowledged'?tag('Reviewed'):`<button class="btn btn-small" data-ack="${a.id}">Acknowledge</button>`}</td></tr>`).join('')}</tbody></table></div></div><div class="card card-pad"><div><h2 class="card-title">Rapid assistance intake</h2><p class="card-sub">Create a fictional report and route it to follow-up</p></div><div class="status-banner mt18">For an immediate life-threatening emergency, contact local emergency services. This demo does not contact first responders.</div><form id="aidForm" class="mt18"><div><label class="form-label" for="household">Fictional household reference</label><input id="household" name="household" class="field" placeholder="Household 005" required maxlength="70"/></div><div class="mt18"><label class="form-label" for="need">What help is needed?</label><textarea id="need" name="need" class="field" placeholder="Our home flooded and we need temporary shelter..." required maxlength="300"></textarea></div><div class="mt18"><label class="form-label" for="urgency">Urgency (human-reported)</label><select id="urgency" name="urgency" class="field"><option value="medium">Standard follow-up</option><option value="high">Urgent assistance</option><option value="critical">Immediate safety concern (escalate)</option></select></div><button class="btn btn-primary w100 mt18" type="submit">Create assistance case ${ICON('arrow',14)}</button></form></div></div><div class="card card-pad mt18"><div class="row-between"><div><h2 class="card-title">Nobody overlooked</h2><p class="card-sub">Requests older than 30 simulated minutes without acknowledgment</p></div>${tag(state.aid.filter(a=>a.age>=30&&a.status!=='Acknowledged').length+' flagged',state.aid.some(a=>a.age>=30&&a.status!=='Acknowledged')?'warn':'neutral')}</div><div class="action-list">${state.aid.filter(a=>a.age>=30&&a.status!=='Acknowledged').map(a=>`<div class="action-row"><span class="action-num">!</span><div><b>${esc(a.id)} · ${esc(a.need)}</b><p>${a.age} minutes without confirmed acknowledgment. Human follow-up recommended.</p></div></div>`).join('')||'<div class="empty">No overdue requests in this scenario.</div>'}</div></div>`}
function render(){renderNav();let content=({overview,properties,finance,experts,messages,statefarm}[active]||overview)();document.getElementById('appRoot').innerHTML=shell(content);if(active==='messages'){let m=document.getElementById('messagesScroll');if(m)m.scrollTop=m.scrollHeight;}persist()}
function storm(){state.storm=true;let newInc=[{id:'INC-103',property:'P-03',title:'Exterior water penetration reported',severity:'medium',need:'Structural',status:'New',day:0,assigned:null,approved:false},{id:'INC-104',property:'P-04',title:'Electrical equipment exposed to water',severity:'critical',need:'Electrical',status:'New',day:0,assigned:null,approved:false},{id:'INC-105',property:'P-05',title:'Loading dock flooding',severity:'high',need:'Restoration',status:'New',day:0,assigned:null,approved:false}];for(let i of newInc){if(!state.incidents.some(x=>x.id===i.id))state.incidents.push(i)}for(let p of state.properties){if(['P-01','P-02','P-04','P-05'].includes(p.id)){p.risk=Math.min(99,p.risk+21);p.status='Storm affected';p.days+=1}}log('Hurricane Meridian scenario activated','high');toast('Storm scenario activated. Incident queue and estimates updated.');render()}
function markExpert(id){const e=state.experts.find(x=>x.id===id);if(!e)return;if(state.incidents.some(i=>i.approved&&i.assigned===id)){toast('This expert has an approved assignment. Reassignment requires human review.');return}e.available=!e.available;log(`${e.name} marked ${e.available?'available':'unavailable'}`);toast('Specialist availability updated; recommendations recalculated.');render()}
function approve(id){const a=assignments().find(x=>x.inc.id===id);if(!a||!a.expert){toast('No feasible qualified assignment for this incident.');return}const i=state.incidents.find(x=>x.id===id);i.approved=true;i.assigned=a.expert.id;i.status='Approved';log(`Human approved ${a.expert.name} for ${id}`);toast('Proposal approved and recorded in local audit log.');render()}
function setProperty(id){if(!prop(id))return;state.selectedProperty=id;active='properties';render()}
function addMessage(text,who='contractor'){state.messages.push({id:Date.now()+Math.random(),who,text,time:now()});const s=text.toLowerCase();if(who==='contractor'&&(/unavailable|can't|cannot|not available|can't make|unable|busy|decline/.test(s))){const e=state.experts.find(x=>x.id==='E-02');if(!state.incidents.some(i=>i.approved&&i.assigned==='E-02')){e.available=false;log('Jordan Lee declined · availability updated');state.messages.push({id:Date.now()+1,who:'agent',text:'Understood. I marked Jordan unavailable and recalculated the proposed assignment. A human coordinator must approve the replacement.',time:now()});toast('Decline detected: expert availability updated and assignments recalculated.')}else {state.messages.push({id:Date.now()+1,who:'agent',text:'This expert has an approved assignment. The coordinator must review and change it manually.',time:now()});toast('Approved assignment needs manual review.')}}else if(who==='contractor'){state.messages.push({id:Date.now()+1,who:'agent',text:'Thank you. The information is recorded in the incident communications history.',time:now()});toast('Message recorded in simulated conversation.')}log('Simulated communication processed');render()}
function addAid(form){const name=String(form.get('household')||'').trim(),need=String(form.get('need')||'').trim(),priority=String(form.get('urgency')||'medium');if(!name||!need||!['critical','high','medium'].includes(priority)){toast('Please complete the intake details.');return}let id='SF-'+String(2001+state.aid.length);state.aid.unshift({id,name,need,priority,zone:'Unspecified region',status:priority==='critical'?'Escalation needed':'New',age:0});log(`Assistance request ${id} created${priority==='critical'?' — human escalation recommended':''}`,'high');toast('Fictional assistance case created. Human follow-up required.');render()}
function ackAid(id){const a=state.aid.find(x=>x.id===id);if(!a)return;a.status='Acknowledged';log(`Assistance request ${id} acknowledged`);toast('Acknowledgment saved in this browser.');render()}
const root=document;
root.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-action],[data-property],[data-expert],[data-approve],[data-ack]');if(!b)return;if(b.dataset.nav){active=b.dataset.nav;render();return}if(b.dataset.property){setProperty(b.dataset.property);return}if(b.dataset.expert){markExpert(b.dataset.expert);return}if(b.dataset.approve){approve(b.dataset.approve);return}if(b.dataset.ack){ackAid(b.dataset.ack);return}switch(b.dataset.action){case 'storm':storm();break;case 'reset':if(confirm('Reset all synthetic scenario changes in this browser?')){state=initial();active='overview';toast('Synthetic demo reset.');render()}break;case 'refresh-plan':toast('Qualification-aware recommendations refreshed.');render();break;case 'expert-declines':addMessage("I can't make it today. Please find someone else.");break}});
root.addEventListener('change',e=>{if(e.target.matches('[data-select-property]')){state.selectedProperty=e.target.value;render()}if(e.target.matches('[data-finance]')){let key=e.target.dataset.finance,num=Number(e.target.value);const bounds={delay:[0,10],efficiency:[0,100],intervention:[0,1e7]};if(!Number.isFinite(num)||num<bounds[key][0]||num>bounds[key][1]){toast('Invalid scenario input.');return}state.finance[key]=num;render()}});
root.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();const input=e.target.querySelector('input[name="msg"]');const s=input.value.trim();if(s)addMessage(s);return}if(e.target.id==='aidForm'){e.preventDefault();addAid(new FormData(e.target))}});
render();
})();
</script>
</body></html>
